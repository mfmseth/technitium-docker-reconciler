name: Build and push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :latest; a vX.Y.Z git tag -> :vX.Y.Z (what homelab-compose
      # pins, so Renovate can propose bumps).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mfmseth/technitium-docker-reconciler
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          # Fixed 2026-09-25: this only ever built amd64 before --
          # pi (the host this actually needs to run on) is aarch64, so
          # the image was never actually runnable there even once
          # pulled. Pure-Python base image, no compiled deps, so
          # QEMU-emulated cross builds are cheap and reliable here.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
